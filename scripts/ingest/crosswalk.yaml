# CropStack crop slug → the name each source uses for it. Hand-maintained; a missing key = the source has no row.
# gbif:        scientific name checked against the GBIF Backbone (accepted name and family)
# fao56_stages / fao56_kc / fao56_roots: FAO-56 Tables 11 / 12 / 22 row names as in pyfao56 tools/tables.py
# harrington:  row name on the OSU Harrington germination page
# openfarm:    slug in the OpenFarm rescue crops.json
# ecocrop:     CODE in FAO ECOCROP (Recocrop's table). Kale uses 155 (Collards: same cultivar group, Brassica oleracea
#              Acephala); pumpkin 50 (Cucurbita maxima); zucchini 168 (vegetable marrow, C. pepo); radish 1617
#              (garden radish, small-rooted); turnip 91 (Brassica rapa, turnip); tomato 17 (listed as Lycopersicon).
# gbif_status: expected GBIF status when not ACCEPTED (pea: GBIF follows the move to Lathyrus oleraceus; gardeners and
#              seed packets still say Pisum sativum, so the catalog keeps it)

