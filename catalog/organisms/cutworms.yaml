    - ref: uc-ipm
      locator: 'Vegetable pest notes: Cutworms'
      retrieved: '2026-10-10'
  first_action:
    value: Dig around the stump and remove the caterpillar. Protect seedlings with a collar of card or a cut can pushed 2
      cm into the soil.
    evidence: extension-service
    confidence: medium
    sources:
    - ref: uc-ipm
      locator: 'Vegetable pest notes: Cutworms'
      retrieved: '2026-10-10'
  safety:
