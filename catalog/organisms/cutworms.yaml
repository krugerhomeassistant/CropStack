organism_type: pest
scientific_name: null
description: Fat grey-brown caterpillars that live in the soil and cut seedlings off at ground level at night.
params:
  identify:
    value: Seedlings felled overnight at the base, and a curled, C-shaped caterpillar in the soil near the stump.
    evidence: extension-service
    confidence: medium
    sources:
    - ref: uc-ipm
      locator: 'Vegetable pest notes: Cutworms'
      retrieved: '2026-10-10'
  look_when:
