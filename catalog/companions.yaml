# Companion planting between catalog crops: pairs that are traditionally grown together (good) or kept apart (avoid),
# plus flowers that are traditionally grown beside a crop. Hints only, never rules: the year plan prefers a bed that
# already holds a good companion and keeps an "avoid" pair out of the same bed. Evidence is `traditional` for every
# pair (no pair-specific study); promote an entry only with one.
# Pairs are facts taken from the Wikipedia "List of companion plants" table (CC BY-SA 4.0, revision 1334550406),
# restricted to crops in this catalog; a pair listed as both good and avoid is left out of `good`.
