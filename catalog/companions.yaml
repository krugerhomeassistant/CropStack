# Companion planting between catalog plants (crops and companion flowers): pairs that are traditionally grown together
# (good) or kept apart (avoid). Hints only, never rules: the year plan prefers to place a crop touching a good
# companion and keeps an "avoid" pair out of the same bed. Evidence is `traditional` for every pair (no pair-specific
# study); promote an entry only with one.
# Facts taken from the Wikipedia "List of companion plants" table (CC BY-SA 4.0, revision 1334550406), read in both
# directions (the row for a crop and the row for a flower), family-level entries ("brassicas") applied to each catalog
# crop of that family, and restricted to plants in this catalog. A pair listed as both good and avoid is left out of
# `good`. Which flowers go with a crop is every `good` partner that has `purpose: companion`.
