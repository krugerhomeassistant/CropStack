name: CI & release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: New version on main = release (no tag push needed)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(python3 -c "import re;print(re.search(r'\"(.+)\"', open('backend/app/__init__.py').read()).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/tags/v$V" ]; then R=true
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && ! gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then R=true
          else R=false; fi
          echo "release=$R" >> "$GITHUB_OUTPUT"; echo "version $V, release $R"
      - name: Versions agree (and changelog has a section when releasing)
        run: |
          V="${{ steps.v.outputs.version }}"
          F=$(python3 -c "import json;print(json.load(open('frontend/package.json'))['version'])")
          [ "$F" = "$V" ] || { echo "frontend $F != backend $V. Run scripts/bump.py $V"; exit 1; }
          if [ "${{ steps.v.outputs.release }}" = "true" ]; then grep -q "^## \[$V\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$V] section"; exit 1; }; fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      - run: pip install ruff
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: Backend tests + frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.14", cache: pip, cache-dependency-path: backend/requirements.txt }  # = Docker runtime
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest -q
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Browser E2E and screenshots (outside services stubbed)
        working-directory: frontend
        env: { CROPSTACK_URL: "http://127.0.0.1:8512" }
        run: |
          npx playwright install --with-deps chromium
          (cd ../backend && CROPSTACK_DATA_DIR=$RUNNER_TEMP/cs-e2e CROPSTACK_STATIC_DIR=../frontend/dist CROPSTACK_SCHEDULER=false \
            python -m tests.e2e_server --port 8512 > $RUNNER_TEMP/server.log 2>&1 &)
          timeout 30 bash -c 'until curl -sf $CROPSTACK_URL/api/health; do sleep 1; done'
          npm run e2e
          CROPSTACK_USER=jan CROPSTACK_PASSWORD=garden123 npm run screenshots
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: frontend/screenshots/
          if-no-files-found: ignore

  image:
    name: Docker image
    needs: [version, lint, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/cropstack
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release }}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: [version, image]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG
        run: |
          V="${{ needs.version.outputs.version }}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          printf '\n---\n**Docker:** `ghcr.io/%s/cropstack:%s`\n' "${GITHUB_REPOSITORY_OWNER}" "$V" >> notes.md
      - name: Create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V="${{ needs.version.outputs.version }}"
          gh release create "v$V" --title "CropStack v$V" --notes-file notes.md --target "$GITHUB_SHA" --latest
