name: Bug report
description: Something in CropStack isn't working
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [CropStack app, Docker / install, Climate & calendar, Plant encyclopedia, Garden mapper, Home Assistant, Garden assistant]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: From `/api/health`.
      placeholder: "0.1.0"
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker logs cropstack`. Please remove anything personal (location, keys)."
      render: text
