# Developer CLI config only (e.g. `alembic revision --autogenerate -m "add planting"` from backend/).
# The app runs migrations itself on startup (app/db.py: init_db), using the same script location.
[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
